<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradAbsent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B28" />
      <stop offset="100%" stop-color="#141311" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D9A84E" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background circle with subtle border -->
  <circle cx="50" cy="50" r="46" fill="url(#gradAbsent)" stroke="#D9A84E" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.9" />
  
  <!-- Urna / Ballot Box symbol -->
  <rect x="28" y="44" width="44" height="32" rx="6" fill="#1C1B18" stroke="#D6D4CF" stroke-width="2" />
  
  <!-- Slot on top of ballot box -->
  <line x1="38" y1="44" x2="62" y2="44" stroke="#D9A84E" stroke-width="3" stroke-linecap="round" />
  
  <!-- Dashed empty ballot floating away (symbolizing absent voter) -->
  <path d="M 42 22 L 58 18 L 62 34 L 46 38 Z" fill="none" stroke="#D9A84E" stroke-width="2" stroke-dasharray="3 2" filter="url(#glow)" />
  
  <!-- Badge text '00' -->
  <text x="50" y="65" font-family="'Geist', 'Inter', system-ui, sans-serif" font-weight="700" font-size="16" fill="#E8E6E1" text-anchor="middle" letter-spacing="1">00</text>
  <text x="50" y="73" font-family="'Geist', 'Inter', system-ui, sans-serif" font-weight="600" font-size="6.5" fill="#A6A39C" text-anchor="middle" letter-spacing="0.5">AUSENTE</text>
</svg>
